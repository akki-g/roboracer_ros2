# Real car (f1tenth_stack bringup). /drive is ackermann_mux's "navigation"
# input (priority 10); the joystick (priority 100) overrides it.
policy_node:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    drive_topic: /drive
    max_speed: 10.0          # m/s - default; raise only per the test protocol stage
    steer_limit: 0.4422     # rad (servo end stop; models before phase 1d command at most 0.4189)
    ttc_threshold: 0.5      # s
    ttc_half_angle_deg: 0.0
    ttc_brake: true         # with a 0 deg cone only the centre beam (index 540) can brake
    scale_speed: false      # true: policy's 0-8 m/s mapped onto 0..max_speed: unchanged below scale_knee x max_speed,
                            # faster requests compressed toward the cap (feeds back the mapped command)
    scale_knee: 0.7
    speed_gain: 1.0         # multiplies the policy's speed request
    min_speed: 0.0          # m/s floor for moving requests (0 = off; ~0.5 gets the car out of crawls)
    speed_smoothing: 1.0    # fraction of the way to a new speed request per tick (1 = off; 0.5 smooths stop-and-go)
    deadman_button: 5         # drive only while RB (joy button 5, joy_teleop's autonomous deadman) is held; -1 off
    scan_timeout: 0.1       # s
    odom_timeout: 0.2       # s
    scan_resample: false    # the car must deliver the UST-10LX's 1081 beams
