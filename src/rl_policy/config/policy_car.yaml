# Real car (f1tenth_stack bringup). /drive is ackermann_mux's "navigation"
# input (priority 10); the joystick (priority 100) overrides it.
policy_node:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    drive_topic: /drive
    max_speed: 1.5          # m/s - default; raise only per the test protocol stage
    steer_limit: 0.4189     # rad
    ttc_threshold: 0.5      # s
    ttc_half_angle_deg: 30.0
    scan_timeout: 0.1       # s
    odom_timeout: 0.2       # s
