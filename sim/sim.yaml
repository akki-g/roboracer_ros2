# Simulator settings (from f1tenth_gym_ros/config/sim.yaml). The bridge needs
# every key below. Edits apply on the next launch, no rebuild needed.
bridge:
  ros__parameters:
    # Track. Default is the Levine hall map that ships with the simulator.
    # Your own map from slam_toolbox: save it into sim/maps/ and use e.g.
    #   map_path: '/root/ros2_ws/sim/maps/our_track'   map_img_ext: '.pgm'
    map_path: '/sim_ws/src/f1tenth_gym_ros/maps/levine'
    map_img_ext: '.png'

    # Starting pose on the map (meters, radians)
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # LiDAR (matches the Hokuyo 10LX/30LX: 270 degrees, 1080 beams)
    scan_fov: 4.7
    scan_beams: 1080
    scan_distance_to_base_link: 0.275

    # Keyboard driving through /cmd_vel (teleop_twist_keyboard)
    kb_teleop: True

    # Topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'

    # Second car (set num_agent: 2 to race against it)
    num_agent: 1
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0