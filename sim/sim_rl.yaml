# ROS sim settings for the phase-1 RL policy (rl_policy). Same keys as sim.yaml.
#   ./start_sim.sh sim/sim_rl.yaml
#   ros2 launch rl_policy policy.launch.py mode:=sim policy_path:=<policy.npz>
# Differences from sim.yaml, so the sim matches what the policy was trained on:
#  - a held-out training map (Duct1077, 2.2 m wide generated duct track)
#  - scan_fov / scan_beams state the sim's real LiDAR (f1tenth_gym always
#    casts 1080 beams over 4.7 rad; these keys only set the LaserScan
#    metadata). rl_policy's sim config resamples to the policy's 109 angles.
#  - LiDAR 0.1037 m ahead of the sim's reference point: the classic gym's
#    state is the CG (single-track model) and the real LiDAR sits 0.275 m
#    ahead of the rear axle, lr = 0.1713 m behind the CG
bridge:
  ros__parameters:
    map_path: '/root/ros2_ws/sim/maps/Duct1077'
    map_img_ext: '.png'

    # on the centerline at s = 0, heading along the track
    sx: 10.6083
    sy: 3.5881
    stheta: 3.0314

    scan_fov: 4.7
    scan_beams: 1080
    scan_distance_to_base_link: 0.1037

    kb_teleop: True

    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'

    num_agent: 1
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0
